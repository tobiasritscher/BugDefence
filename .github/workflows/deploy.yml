name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual runs from the Actions tab

# Only keep the newest deploy running; cancel superseded ones.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assemble a clean web root: the entry file becomes index.html so the
      # game loads at the domain root (no space-in-filename URL).
      - name: Assemble site
        run: |
          mkdir -p dist
          cp "Bug Defence.html" dist/index.html
          cp -r css js dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@3
          # create the project on first run; ignore the error if it already exists
          wrangler pages project create bug-defence --production-branch=main || true
          wrangler pages deploy dist --project-name=bug-defence --branch=main --commit-dirty=true
